name: Deploy to Cloudflare

# Validates the configs against the projektor release (./projektor.version, "latest" by
# default) on PRs, daily and on push. It deploys only when the repository variable
# DEPLOY_CONFIG names a wrangler config (and DEPLOY_URL the URL to health-check). That is
# opt-in so a fork can auto-deploy its own instance, while this repo, with neither set,
# never overwrites the live demo, which TAJD/projektor-workspace deploys (PROJ-1073).
#
# Also runs on PRs targeting main (dry-run only, no Cloudflare auth needed) so
# this job can be a required status check on main (see the branch ruleset) —
# a push-only trigger would never report a check on a PR's head commit and
# would block every merge forever.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Daily: catch a new projektor release that needs config this repo doesn't have yet
  # (projektor.version is "latest", so the Deploy button picks releases up immediately).
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read   # checkout + gh release download only; no write access needed

jobs:
  deploy:
    name: Deploy projektor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # wrangler 4.x requires Node >= 22

      - name: Install wrangler
        run: npm install

      - name: Fetch release
        run: |
          set -euo pipefail
          VERSION="$(cat projektor.version)"
          echo "==> Fetching projektor $VERSION from $PROJEKTOR_REPO"
          rm -rf vendor && mkdir -p vendor
          TMP="$(mktemp -d)"
          TAG="$VERSION"; [ "$VERSION" = "latest" ] && TAG=""
          gh release download $TAG -R "$PROJEKTOR_REPO" -p 'projektor-*.tar.gz' -D "$TMP"
          tar -xzf "$TMP"/projektor-*.tar.gz -C vendor
          rm -rf "$TMP"
        env:
          # The projektor repo to pull the release from.
          PROJEKTOR_REPO: TAJD/projektor
          # projektor is public, so the default job token (read-only, scoped to
          # this run) is enough to fetch the release asset — no PAT needed.
          GH_TOKEN: ${{ github.token }}

      - name: Check committed configs against the release template
        # wrangler.jsonc must be committed for the Deploy button, so it can drift from
        # the release's vendor/wrangler.example.toml. This is what fails when it does.
        run: node scripts/wrangler-config.mjs check wrangler.jsonc wrangler.demo.toml

      - name: Validate (dry-run)
        # Runs on PRs — compiles + checks bindings against wrangler.demo.toml
        # without uploading or needing Cloudflare auth, so this passes for
        # untrusted/fork PRs too.
        if: github.event_name == 'pull_request' || github.event_name == 'schedule' || vars.DEPLOY_CONFIG == ''
        run: |
          npx wrangler deploy --config wrangler.demo.toml --dry-run
          npx wrangler deploy --config wrangler.jsonc --dry-run

      - name: Migrate + deploy
        # Opt-in: set the repository variable DEPLOY_CONFIG to your committed,
        # binding-only wrangler config (e.g. a copy of wrangler.demo.toml renamed for
        # your instance). Unset, nothing is deployed.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.DEPLOY_CONFIG != ''
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply DB --remote --config "$DEPLOY_CONFIG"
          npx wrangler deploy --config "$DEPLOY_CONFIG"
        env:
          DEPLOY_CONFIG: ${{ vars.DEPLOY_CONFIG }}
          # Cloudflare auth (see README for the correct token scopes — must include D1).
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Health check
        # Catch a broken deploy in CI instead of discovering it later (PROJ-280).
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.DEPLOY_URL != ''
        run: |
          set -euo pipefail
          code="$(curl -s -o /dev/null -w '%{http_code}' "$DEMO_URL")"
          echo "==> $DEMO_URL responded $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Health check failed: $DEMO_URL returned $code"
            exit 1
          fi
        env:
          DEMO_URL: ${{ vars.DEPLOY_URL }}
